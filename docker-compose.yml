services:
  db:
    image: postgres:16
    container_name: miniblog-db
    environment:
      POSTGRES_DB: miniblog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - miniblog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: miniblog-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/miniblog
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    container_name: miniblog-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  miniblog-data:
